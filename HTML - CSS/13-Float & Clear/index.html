<body>

    <h2>Float Next To Each Other</h2>

<p>In this example, the four divs will float next to each other.</p>

<div class="div1 left-float">Div 1</div>
<div class="div2 left-clear">Div 2</div>
<div class="div3 right-float">Div 3</div>
<div class="div4 right-clear">Div 4</div>
    
</body>
