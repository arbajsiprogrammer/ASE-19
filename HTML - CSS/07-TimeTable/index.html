<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07 time table</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="container">
    <div class="table-container">
        <table >
            <!-- 1st row -->
            <tr>
                <th colspan="6">Time Table</th>
            </tr>

            <!-- 2nd row -->
            <tr>
                <th rowspan="6">Hours</th>
                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
            </tr>

            <!-- 3rd row -->
            <tr>
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Arts</td>
            </tr>

            <!-- 4th row -->
            <tr>
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Arts</td>
            </tr>

            <!-- 5th row -->
            <tr>
                <th colspan="5">LUNCH</th>
            </tr>

            <!-- 6th row -->
            <tr>
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
                <td rowspan="2">Project</td>
            </tr>

            <!-- 7h row -->
            <tr>
                <td>Science</td>
                <td>Maths</td>
                <td>Science</td>
                <td>Maths</td>
            </tr>
        </table>
    </div>
    </div>
</body>
</html>
