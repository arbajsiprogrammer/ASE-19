<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11 Box layout</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="container">

        <!-- example one -->
        <!-- box-sizing: content-box; -->
        <h1>example of content-box</h1>
        <div class="content-box"></div>
        <!-- content size of this div => 200px  -->
        <!-- padding size of this div => 20* 4 sides = 80 -->
        <!--so total width of this div is => 200 + left padding 20 + right padding 20 = 240  -->
        <!--so total height of this div is => 200 + top padding 20 + bottom padding 20 = 240  -->

        <h1>example of border-box</h1>
        <div class="border-box"></div>
        <!-- content size of this div => 200px  -->
        <!-- padding size of this div => 20* 4 sides = 80 -->
        <!-- when we use 
    box-sizing: border-box;
    
    it include content + border + padding into 200px -->
    
    

         


    </div>
    
</body>
</html>
