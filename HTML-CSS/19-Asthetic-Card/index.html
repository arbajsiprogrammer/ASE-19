<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19-Asthetic-Card</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="container">
        <div class="card-container">
            <!-- 1st card - pasta -->
            <div class="card">
                <img src="./Images/pasta01.jpeg" alt="img">
                <h3 class="title">Pasta Primavera </h3>
                <p class="description"> Fresh pasta with seasonal vegetables and Parmesan</p>
                <p class="price">$12.99</p>
            </div>

            <!-- 2nd card - salad -->
             <div class="card">
                <img src="./Images/salad.jpg" alt="img">
                <h3 class="title">Caesar Salad</h3>
                <p class="description">Crisp lettuce, croutons and Caesar dressing</p>
                <p class="price">$7.99</p>
            </div>

            <!-- 3rd card - pizza -->
             <div class="card">
                <img src="./Images/pizza.avif" alt="img">
                <h3 class="title">Margherita Pizza</h3>
                <p class="description">Classic Pizza with mozzarella, tomatoes and basil</p>
                <p class="price">$9.99</p>
            </div>
            
        </div>
    </div>
</body>
</html>
