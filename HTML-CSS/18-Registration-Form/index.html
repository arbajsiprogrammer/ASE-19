<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18 Registration Form</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="container">
        <div class="table-wrapper">
            <table>
                <thead> 
                    <tr>
                        <th colspan="2">Registration Form</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                    <td>Student name</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Father name</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Mother name</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>date of Birth</td>
                    <td><input type="date"></td>
                </tr>

                <tr>
                    <td>Gender</td>
                    <td>
                        Male<input type="radio" name="gender"> Female<input type="radio" name="gender">
                    </td>
                </tr>

                <tr>
                    <td>Email </td>
                    <td><input type="email"></td>
                </tr>

                <tr>
                    <td>Mobile Number</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Address </td>
                    <td><textarea name="address"  ></textarea></td>
                </tr>

                <tr>
                    <td>State</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>City</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    
                    <td colspan="2" class="button-container"><button class="submit">Submit</button></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
