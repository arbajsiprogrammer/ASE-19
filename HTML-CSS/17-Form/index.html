<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17 Form</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>

    <div class="container">
    
        <form >

            <!-- personal details -->
             <fieldset>
                <legend>Personal details</legend>
                <div class="personal">
                    <!-- Applicants name -->
                    <div class="personal-item">

                        <div class="label"><label for="name">Applicants Name</label></div>
                        <div class="personal-item-right">
                            <!-- drop box for gender -->
                            <select name="Select Option">
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">other</option>
                                <option value="not-desclosed">no disclose</option>
                            </select>

                            <!-- input box for name  -->
                             <input type="text" placeholder="enter name" id="name" >

                        </div>
                    </div>

                    <!-- care of -->
                    <div class="personal-item">
    
                        <label >Care Of</label>
                        <div class="personal-item-right">

                            Parents<input type="radio" name="care-of">
                            Guardians <input type="radio" name="care-of">
                            
                        </div>
                    </div>

                    <!-- Fathers name -->
                    <div class="personal-item">

                        <div class="label">
                            <label  >Fathers name</label>
                        </div>

                        <div class="personal-item-right">
                            <!-- drop box for father -->
                            <select name="Select Option">
                                <option value="male">Mr</option>
                                <option value="female">Sir</option>
                                <option value="other">other</option>
                                <option value="not-desclosed">no disclose</option>
                            </select>

                            <!-- input box for name  -->
                             <input type="text" placeholder="enter name" >

                        </div>
                    </div>

                    <!-- Mothers name -->
                    <div class="personal-item">

                        <div class="label">
                            <label  >Mothers name</label>
                        </div>

                        <div class="personal-item-right">
                            <!-- drop box for Mothers -->
                            <select name="Select Option">
                                <option value="male">Ms</option>
                                <option value="female">ma'am</option>
                                <option value="other">other</option>
                                <option value="not-desclosed">no disclose</option>
                            </select>

                            <!-- input box for name  -->
                             <input type="text" placeholder="enter name" >

                        </div>
                    </div>

                    <!-- Gender -->
                    <div class="personal-item">
    
                        <label  >Gender</label>
                        <div class="personal-item-right">
                            male<input type="radio" name="gender">
                            female <input type="radio" name="gender">
                            other <input type="radio" name="gender"  >
                        </div>
                    </div>

                    <!-- Date of birth -->
                    <div class="personal-item">
    
                        <label  >Date Of birth</label>
                        <div class="personal-item-right">
                            <input type="date">
                        </div>
                    </div>

                    <!-- Marital Status -->
                    <div class="personal-item">
    
                        <label  >Marital Status</label>
                        <div class="personal-item-right">
                            <select name="Select option"  >
                                <option value="married">married</option>
                                <option value="un-married">un-married</option>
                            </select>
                        </div>
                    </div>

                    <!-- Category -->
                    <div class="personal-item">
    
                        <label  >Category</label>
                        <div class="personal-item-right">
                            <select name="Select option"  >
                                <option value="married">general</option>
                                <option value="un-married">other</option>
                            </select>
                        </div>
                    </div>

                    <!-- Handicap -->
                    <div class="personal-item">
    
                        <label  >Handicap</label>
                        <div class="personal-item-right">
                            Yes<input type="radio" name="Handicap">
                            No <input type="radio" name="Handicap">
                        </div>
                    </div>
                    <!-- Ex-servent -->
                    <div class="personal-item">
    
                        <label  >Ex-servent </label>
                        <div class="personal-item-right">
                            Yes<input type="radio" name="Handicap">
                            No <input type="radio" name="Handicap">
                        </div>
                    </div>

                    <!-- EWS -->
                    <div class="personal-item">
    
                        <label  >EWS</label>
                        <div class="personal-item-right">
                            Yes<input type="radio" name="Handicap">
                            No <input type="radio" name="Handicap">
                        </div>
                    </div>

                </div>
             </fieldset>


             <!-- Contact details -->
             <fieldset>
                <legend>Contact details</legend>
                <div class="personal contact">
                    <!-- Mobile Number -->
                    <div class="personal-item">
                        <div class="label">
                            <label  >Mobile Number</label>
                        </div>
                        <div class="personal-item-right">
                            <!-- input box for Mobile Number  -->
                             <input type="text" placeholder="enter mobile number" >
                        </div>
                    </div>

                    <!-- Email Id -->
                     <div class="personal-item">
                        <div class="label">
                            <label  >Email Id </label>
                        </div>
                        <div class="personal-item-right">
                            <!-- input box for Mobile Number  -->
                             <input type="text" placeholder="enter email id " >
                        </div>
                    </div>

                    <!-- Address Line 1 -->
                     <div class="personal-item">
                        <div class="label">
                            <label  >Address Line 1 </label>
                        </div>
                        <div class="personal-item-right">
                            <!-- input box for Mobile Number  -->
                             <input type="text" placeholder="enter address" >
                        </div>
                    </div>

                    <!-- Address Line 2 -->
                     <div class="personal-item">
                        <div class="label">
                            <label  >Address Line 2</label>
                        </div>
                        <div class="personal-item-right">
                            <!-- input box for Mobile Number  -->
                             <input type="text" placeholder="enter address" >
                        </div>
                    </div>

                    <!-- city -->
                     <div class="personal-item">
                        <div class="label">
                            <label  >City</label>
                        </div>
                        <div class="personal-item-right">
                            <!-- input box for City -->
                             <input type="text" placeholder="enter city" >
                        </div>
                    </div>

                    <!-- State -->
                    <div class="personal-item">
    
                        <label  >State</label>
                        <div class="personal-item-right">
                            <select name="Select option"  >
                                <option value="married">Maharashtra</option>
                                <option value="un-married">other</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Pin code -->
                     <div class="personal-item">
                        <div class="label">
                            <label  >Pin Code</label>
                        </div>
                        <div class="personal-item-right">
                            <!-- input box for City -->
                             <input type="text" placeholder="enter pin code" >
                        </div>
                    </div>

                </div>
             </fieldset>


             <!-- Qualification Details -->
             <fieldset>
                <legend>Qualification Details</legend>
                <div class="qualification-details">                
                <div class="qualification-details-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Sr. No.</th>
                            <th>Qualification</th>
                            <th>Board/University</th>
                            <th>Passing Year</th>
                            <th>Max Marks</th>
                            <th>Marks Obtain</th>
                            <th>Percentage</th>
                            </tr>
                        </thead>
                        <tbody>

                            <!-- Row-1 -->
                            <tr>
                                <td>1</td>
                                <td>
                                    <select name="Select Option"  >
                                        <option value="Option-1">Option-1</option>
                                        <option value="Option-1">Option-2</option>
                                        <option value="Option-1">Option-3</option>
                                        <option value="Option-1">Other</option>
                                    </select>
                                </td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                            </tr>

                            <!-- Row-2 -->
                            <tr>
                                <td>2</td>
                                <td>
                                    <select name="Select Option"  >
                                        <option value="Option-1">Option-1</option>
                                        <option value="Option-1">Option-2</option>
                                        <option value="Option-1">Option-3</option>
                                        <option value="Option-1">Other</option>
                                    </select>
                                </td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                            </tr>

                            <!-- Row-3 -->
                            <tr>
                                <td>3</td>
                                <td>
                                    <select name="Select Option"  >
                                        <option value="Option-1">Option-1</option>
                                        <option value="Option-1">Option-2</option>
                                        <option value="Option-1">Option-3</option>
                                        <option value="Option-1">Other</option>
                                    </select>
                                </td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                            </tr>

                            <!-- Row-4 -->
                            <tr>
                                <td>4</td>
                                <td>
                                    <select name="Select Option"  >
                                        <option value="Option-1">Option-1</option>
                                        <option value="Option-1">Option-2</option>
                                        <option value="Option-1">Option-3</option>
                                        <option value="Option-1">Other</option>
                                    </select>
                                </td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                                <td><input type="text"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                </div>
             </fieldset>

             <!-- language Knowledge -->
             <fieldset>
                <legend>language Knowledge </legend>
                <div class="language-Knowledge ">                
                <div class="language-Knowledge-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Language</th>
                            <th>Reading</th>
                            <th>Writing</th>
                            <th>Spoken</th>
                            </tr>
                            </thead>
                        <tbody>

                            <!-- Row-1 -->
                            <tr>
                                <td>Hindi</td>
                                <td>
                                    <input type="checkbox">
                                </td>
                                <td>
                                    <input type="checkbox">
                                </td>
                                <td>
                                    <input type="checkbox">
                                </td>
                            </tr>

                            <!-- Row-2 -->
                            <tr>
                                <td>English</td>
                                <td>
                                    <input type="checkbox">
                                </td>
                                <td>
                                    <input type="checkbox">
                                </td>
                                <td>
                                    <input type="checkbox">
                                </td>
                            </tr>

                            <!-- Row-3 -->
                            <tr>
                                <td>Urdu</td>
                                <td>
                                    <input type="checkbox">
                                </td>
                                <td>
                                    <input type="checkbox">
                                </td>
                                <td>
                                    <input type="checkbox">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                </div>
             </fieldset>
        </form>
    </div>
    
</body>
</html>
