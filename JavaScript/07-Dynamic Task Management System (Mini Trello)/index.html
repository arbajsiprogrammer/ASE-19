<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Dynamic Task Management System</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- external css -->
    <link rel="stylesheet" href="./index.css" />
    <!-- bootstrap icon cdn -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <header>
      <nav class="navbar bg-white shadow-lg">
        <div class="container-fluid px-5">
          <div>
            <img src="./Image/student01.png" id="navbar-img" alt="" />
            <a class="navbar-brand fs-3 fw-bold">MyStack</a>
          </div>
          <div>
            <button
              type="button"
              class="btn btn-primary btn-lg"
              data-bs-toggle="modal"
              data-bs-target="#exampleModal"
              data-bs-whatever="@mdo"
            >
              <i class="bi bi-plus-lg"></i> Create Task
            </button>
          </div>
          <div class="d-flex" >
            <input
              class="form-control me-2"
              type="text"
              placeholder="Search"
              aria-label="Search"
              id="search-ip"
            />
            <button class="btn btn-outline-success" type="button" id="search-btn">
              Search
            </button>
          </div>
        </div>
      </nav>
    </header>
    <!-- (form for create)  -->
    <!--Bootstrap Model (form for create) -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fw-bold" id="exampleModalLabel">
              Create New Task
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="form">
            <div class="modal-body">
              <!-- Task Titel -->
              <div class="mb-3">
                <label
                  for="form-task-title"
                  class="col-form-label fw-bold text-secondary"
                  >TASK TITLE:</label
                >
                <input
                  type="text"
                  class="form-control px-3"
                  id="form-task-title"
                  placeholder="e.g. design system audit"
                />
              </div>
              <!-- description -->
              <div class="mb-3">
                <label
                  for="description"
                  class="col-form-label fw-bold text-secondary"
                  >Description:</label
                >
                <textarea
                  class="form-control px-3"
                  id="form-description"
                  placeholder="Briefly describe the task scope..."
                ></textarea>
              </div>
              <!-- Priority level -->
              <div class="mb-3">
                <label
                  for="priority"
                  class="col-form-label fw-bold text-secondary"
                  >Priority:</label
                >
                <div class="row justify-content-around " id="priority">
                  <div class="col">
                    <button
                      type="button"
                      class="btn btn-lg w-100 create-modal-btn btn-outline-success fw-bold"
                      name="low"
                    >
                      Low
                    </button>
                  </div>
                  <div class="col">
                    <button
                      type="button"
                      class="btn btn-outline-warning btn-lg w-100 create-modal-btn fw-bold"
                      name="medium"
                    >
                      Medium
                    </button>
                  </div>
                  <div class="col">
                    <button
                      type="button"
                      class="btn btn-outline-danger btn-lg w-100 create-modal-btn fw-bold"
                      name="high"
                    >
                      High
                    </button>
                  </div>
                </div>
              </div>
              <!-- Due Date -->
              <div class="mb-3">
                <label
                  for="message-text"
                  class="col-form-label fw-bold text-secondary"
                  >Due Date:</label
                >
                <input
                  type="date"
                  class="form-control px-3"
                  id="form-due-date"
                  placeholder="e.g. design system audit"
                />
              </div>

              <!-- Status todo, in progress, complete-->
              <div class="mb-3">
                <label
                  for="status"
                  class="col-form-label fw-bold text-secondary"
                  >Status:</label
                >
                <div class="row justify-content-around" id="status">
                  <div class="col">
                    <button
                      type="button"
                      class="btn btn-lg w-100 status-btn btn-outline-primary fw-bold"
                      data-bs-toggle="button"
                      name="todo"
                    >
                      Todo
                    </button>
                  </div>
                  <div class="col">
                    <button
                      type="button"
                      class="btn btn-outline-dark btn-lg w-100 status-btn fw-bold"
                      data-bs-toggle="button"
                      name="inProgress"
                    >
                      InProgress
                    </button>
                  </div>
                  <div class="col">
                    <button
                      type="button"
                      class="btn btn-outline-success btn-lg w-100 status-btn fw-bold"
                      data-bs-toggle="button"
                      name="complete"
                    >
                      complete
                    </button>
                  </div>
                </div>
              </div>
              <!-- assign task to  -->
              <div class="all-members px-2 my-2 p-2">
                <select
                  name="all-members"
                  id="all-members"
                  class="w-100 py-2 ps-3 rounded-2 bg-body text-secondary fw-bold"
                  value="all"
                >
                  <option value="All Team Members" selected>
                    Assign to Team
                  </option>
                  <option value="lakhan">lakhan</option>
                  <option value="vishnu">vishnu</option>
                  <option value="pankaj">pankaj</option>
                  <option value="ajinkya">ajinkya</option>
                  <option value="sanket">sanket</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button type="reset" class="btn btn-secondary btn-lg">
                reset
              </button>
              <button type="submit" class="btn btn-primary btn-lg" 
              data-bs-dismiss="modal">
                Add Task
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <main>
      <div class="container">
        <!-- heading of the dashboard  -->
        <div class="row mt-5 border-bottom shadow p-3 rounded">
          <div class="col-lg-6">
            <h1>TaskMaster Dashboard</h1>
            <p class="text-secondary">
              Manage your team workflow and project milestones efficiently.
            </p>
          </div>
          <div class="col-lg-6 text-end align-content-center">
            <button
              class="btn btn-outline-primary shadow-lg px-5 fs-5"
              id="filter-button"
            >
              <i class="bi bi-funnel"></i> Filter
            </button>
            <button
              class="btn btn-outline-primary shadow-lg px-5 ms-3 fs-5"
              id="sort-button"
            >
              <i class="bi bi-filter-circle"></i> Sort
            </button>
          </div>
        </div>

        <!-- card for Filter -->
        <div class="card w-25 ms-auto mt-2" id="filter-card">
          <div class="card-heading">
            <p class="text-secondary fw-bold border-bottom py-4 px-4">
              FILTER TASKS
            </p>
          </div>

          <!-- priority filter -->
          <div class="priority border-bottom pb-2">
            <p class="mt-3 fs-5 fw-bold ms-3">
              <i class="bi bi-exclamation-lg"></i> Priority
            </p>

            <!--  priority checkboxes -->

            <!-- high -->
            <div class="priority-checkbox ms-4 mb-2">
              <input type="checkbox" name="priority-high" id="priority-high" />
              <label for="priority-high">High</label>
            </div>
            <!-- Medium -->
            <div class="priority-checkbox ms-4 mb-2">
              <input
                type="checkbox"
                name="priority-Medium"
                id="priority-Medium"
              />
              <label for="priority-Medium">Medium</label>
            </div>
            <!-- Low -->
            <div class="priority-checkbox ms-4 mb-2">
              <input type="checkbox" name="priority-low" id="priority-low" />
              <label for="priority-low">Low</label>
            </div>
          </div>

          <!-- Due Date -->
          <div class="due-date border-bottom pb-2">
            <p class="mt-3 fs-5 fw-bold ms-3">
              <i class="bi bi-calendar me-1"></i> Due Date
            </p>

            <!--  radio btns -->

            <!-- today -->
            <div class="due-date-radio ms-4 mb-2">
              <input type="radio" name="due-date-today" id="due-date-today" />
              <label for="due-date-today">Today</label>
            </div>
            <!-- 7 days -->
            <div class="due-date-radio ms-4 mb-2">
              <input type="radio" name="due-date-7d" id="due-date-7d" />
              <label for="due-date-7d">7 Days</label>
            </div>
            <!-- over due -->
            <div class="due-date-radio ms-4 mb-2">
              <input
                type="radio"
                name="due-date-overdue"
                id="due-date-overdue"
              />
              <label for="due-date-overdue">Over Due</label>
            </div>
          </div>

          <!-- select members -->
          <div class="all-members px-2 my-2 p-2">
            <select
              name="all-members"
              id="all-members"
              class="w-100 py-2 ps-3 rounded-2 bg-primary-subtle fw-bold"
              value="all"
            >
              <option value="All Team Members" selected>
                All Team Members
              </option>
              <option value="lakhan">lakhan</option>
              <option value="vishnu">vishnu</option>
              <option value="pankaj">pankaj</option>
              <option value="ajinkya">ajinkya</option>
              <option value="sanket">sanket</option>
            </select>
          </div>

          <!-- button container -->
          <div class="btn-container justify-content-between d-flex p-2">
            <button class="btn btn-primary fw-bold px-5 py-2" disabled>
              Clear All
            </button>

            <button class="btn btn-primary fw-bold px-5 py-2">Apply</button>
          </div>
        </div>
        
        <div class="row mt-4">
          <!-- Todo block -->
          <div class="col-4">
            <div class="my-4">
              <div class="mb-3">
                <h1 class="d-flex align-items-center ms-1">
                  To Do
                  <span
                    class="bg-secondary-subtle text-secondary circular-border p-2 fs-6 ms-2 cnt"
                    ></span
                  >
                </h1>
              </div>

              <!-- card list -->
              <div id="todo-card-list">

                    <div><i class="bi bi-pencil"></i></div>
                  </div>
                  <h1 class="my-3">Refactor Database Schema</h1>

                  </div>
                </div> -->
              </div>
            </div>
          </div>

          <!-- In Progress block -->
          <div class="col-4">
            <div class="my-4">
              <div class="mb-3">
                <h1 class="d-flex align-items-center ms-1">
                  In Progress
                  <span
                    class="bg-primary-subtle text-primary circular-border p-2 fs-6 ms-2 cnt"
                    ></span

                </h1>
              </div>

              <div id="inProgress-card-list">
                <!-- <div class="card shadow-lg justify-content-evenly p-3">
                <div class="d-flex justify-content-between px-2">
                  <div
                    class="remark bg-danger-subtle text-danger fw-bold px-3 py-1 rounded-5"
                  >
                    HIGH PRIORITY
                  </div>
                  <div><i class="bi bi-pencil"></i></div>
                </div>
                <h1 class="my-3">Refactor Database Schema</h1>
                <p class="text-secondary fs-5">

                </p>

                <div class="d-flex justify-content-end">

                </div>
              </div> -->
              </div>
            </div>
          </div>

          <!-- Completed block -->
          <div class="col-4">
            <div class="my-4">
              <div class="mb-3">
                <h1 class="d-flex align-items-center ms-1">
                  Completed
                  <span
                    class="bg-success-subtle text-success circular-border p-2 fs-6 ms-2 cnt"
                    ></span
                  >
                </h1>
              </div>
              <div id="complete-card-list">

                <div class="d-flex justify-content-between px-2">
                  <div

                    HIGH PRIORITY

                  <div><i class="bi bi-pencil"></i></div>
                </div>
                <h1 class="my-3">Refactor Database Schema</h1>
                <p class="text-secondary fs-5">

                </p>

                <div class="d-flex justify-content-end">
                  <img src="./Image/student02.png" class="card-img" alt="" />
                  <p class="my-auto text-secondary">
                    <i class="bi bi-calendar"></i> oct 24

                </div>
              </div> -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="./index.js"></script>
    <!-- bootstrap script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

  </body>
</html>
